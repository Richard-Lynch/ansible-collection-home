---
DOCUMENTATION:
  name: zigbee_delta_normalised
  short_description: Diff normalised Zigbee bindings against a live binding table
  author: Richard Lynch (@Richard-Lynch)
  description:
    - Diffs bindings already normalised by P(richard_lynch.home.zigbee_parse_declared#filter) against
      a raw C(binds_get) result.
    - A raw declaration (with C(from)/C(to) keys) is rejected, naming the missing key.
  options:
    _declared:
      description: Normalised bindings, the output of P(richard_lynch.home.zigbee_parse_declared#filter).
      type: list
      elements: dict
      required: true
    live:
      description: The raw C(binds_get) result.
      type: dict
      required: true
    source_ieee:
      description: The IEEE of the device whose table was read, when the payload does not carry it.
      type: str
EXAMPLES: |
  - name: Diff one device's slice of the parsed declaration
    ansible.builtin.set_fact:
      delta: "{{ device_bindings | richard_lynch.home.zigbee_delta_normalised(binds_get_result) }}"
RETURN:
  _value:
    description: The diff.
    type: dict
    contains:
      missing:
        description: Declared bindings the device lacks (what converge writes).
        type: list
        elements: dict
      present:
        description: Declared bindings the device has.
        type: list
        elements: dict
      extra:
        description: Bindings on the device that are not declared (never touched by converge).
        type: list
        elements: dict
      converged:
        description: True when nothing declared is missing.
        type: bool
      counts:
        description: Counts of C(declared), C(missing), C(present) and C(extra).
        type: dict
