# AUTO-GENERATED defaults resolver — DO NOT EDIT.
#
# Source of truth: roles/canon_printer/meta/argument_specs.py
# Regenerate:      venv/bin/python tools/argspec/cli.py x generate canon_printer
#
# Edits here are silently overwritten on the next generation. To change a value or its
# documentation, change the OptionSpec in the source file above — descriptions there
# are emitted as the comments in this file.

# Binds every declared option to its generated default, so a caller-supplied value
# wins and an unsupplied one falls back rather than evaluating Undefined.
#
# Include this FIRST from every entrypoint:
#   - ansible.builtin.include_tasks: _resolve_defaults.yml
#
# Role-specific setup logic belongs in tasks/setup_vars.yml, NOT here — this file is
# overwritten on every generation.
#
# TWO BRANCHES, because `set_fact` persists for the whole play. A role invoked twice in
# one play would otherwise see its OWN leftover facts on the second call, so a later
# caller that omitted an option silently inherited the earlier caller's value instead of
# the declared default. On a repeat call this ignores the role's own facts and rebinds
# the defaults; an include-level `vars:` shadows the fact, so a value the caller DID
# supply this time still wins. Roles called once per play only ever run the first branch.

- name: Resolve declared options over their generated defaults
  ansible.builtin.set_fact:
    canon_printer_action: "{{ canon_printer_action | default(canon_printer_action__default) if canon_printer_action__default is defined else canon_printer_action | default(omit) }}"
    canon_printer_settings: "{{ canon_printer_settings | default(canon_printer_settings__default) if canon_printer_settings__default is defined else canon_printer_settings | default(omit) }}"
    canon_printer_rotate_confirm: "{{ canon_printer_rotate_confirm | default(canon_printer_rotate_confirm__default) if canon_printer_rotate_confirm__default is defined else canon_printer_rotate_confirm | default(omit) }}"
    canon_printer_apply: "{{ canon_printer_apply | default(canon_printer_apply__default) if canon_printer_apply__default is defined else canon_printer_apply | default(omit) }}"
  when: not (_canon_printer__argspec_resolved | default(false))

- name: Rebind the defaults on a repeat call, ignoring this role's own leftover facts
  ansible.builtin.set_fact:
    canon_printer_action: "{{ canon_printer_action__default if canon_printer_action__default is defined else canon_printer_action | default(omit) }}"
    canon_printer_settings: "{{ canon_printer_settings__default if canon_printer_settings__default is defined else canon_printer_settings | default(omit) }}"
    canon_printer_rotate_confirm: "{{ canon_printer_rotate_confirm__default if canon_printer_rotate_confirm__default is defined else canon_printer_rotate_confirm | default(omit) }}"
    canon_printer_apply: "{{ canon_printer_apply__default if canon_printer_apply__default is defined else canon_printer_apply | default(omit) }}"
  when: _canon_printer__argspec_resolved | default(false)

- name: Record that this role has resolved its options in this play
  ansible.builtin.set_fact:
    _canon_printer__argspec_resolved: true
