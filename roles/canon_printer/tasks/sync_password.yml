---
# Make 1Password, the local credentials cache and the device agree — idempotent, safe to run any time.
# Run by rotate_password after the device change, and on its own (canon_printer_action=sync_password)
# to finish a rotation that stopped part-way — one that changed the device and 1Password but not the
# credentials cache leaves the cache serving the OLD password.

- name: HARD GATE — sync needs the item ID, its vault and a pinned CA
  ansible.builtin.assert:
    that:
      - (canon_printer_password_item | default('')) | length > 0
      - (canon_printer_vault | default('')) | length > 0
      - (canon_printer_ca_cert | default('')) | length > 0
    fail_msg: sync_password needs canon_printer_password_item, canon_printer_vault and canon_printer_ca_cert.
    quiet: true

- name: Read the item's recorded URLs
  ansible.builtin.command:
    argv: [op, item, get, "{{ canon_printer_password_item }}", "--vault={{ canon_printer_vault }}", --format, json]
    stdin: ""
  register: _cp_item
  changed_when: false
  no_log: true  # the JSON carries the field values

- name: Record the Remote UI URL on the item so 1Password autofills it
  # shell + </dev/null: with any other stdin `op item edit` tries to parse it as a JSON template and
  # fails ("invalid JSON provided") — the same trap secrets_manager documents.
  ansible.builtin.shell: >-
    op item edit "{{ canon_printer_password_item }}" --vault="{{ canon_printer_vault }}"
    --url="{{ canon_printer_admin_url }}" </dev/null >/dev/null
  when:
    - (canon_printer_admin_url | default('')) | length > 0
    - canon_printer_admin_url not in ((_cp_item.stdout | from_json).urls | default([]) | map(attribute='href') | list)
  changed_when: true

- name: Re-read the password from 1Password, refreshing the credentials cache
  # refresh=true bypasses the cache for this read and re-caches the fresh value, so a cache still
  # serving a superseded password is corrected here rather than by editing the cache file.
  ansible.builtin.set_fact:
    _cp_synced_password: >-
      {{ lookup('richard_lynch.common.onepassword_cached', canon_printer_password_item, field='password',
                vault=canon_printer_vault, refresh=true) }}
  no_log: true

- name: HARD GATE — the device accepts exactly the value 1Password holds
  richard_lynch.home.canon_printer_settings:
    host: "{{ canon_printer_host }}"
    password: "{{ _cp_synced_password }}"
    ca_cert: "{{ canon_printer_ca_cert }}"
    groups: [firmware]
  changed_when: false
