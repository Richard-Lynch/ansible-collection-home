---
# Rotate the Remote UI admin password. ORDER IS THE SAFETY:
#   1. freeze the CURRENT password (the inventory lookup is lazy — after step 2 it would resolve to
#      the new value, and the device would be asked to authenticate with a password it has not got)
#   2. roll 1Password FIRST (secrets_manager backs the old value up before touching it)
#   3. change the device; on ANY failure roll 1Password back to the frozen value
#   4. success = the NEW password logs in AND the OLD one is refused (fresh sessions, in the module)
#   5. evict the cached copy, re-read 1Password, and require it to equal what the device accepted
# Never logs a value. Needs canon_printer_rotate_confirm=true.

- name: HARD GATE — rotation needs its confirm flag, the item ID and a pinned CA
  ansible.builtin.assert:
    that:
      - canon_printer_rotate_confirm | bool
      - (canon_printer_password_item | default('')) | length > 0
      - (canon_printer_vault | default('')) | length > 0
      - (canon_printer_ca_cert | default('')) | length > 0
    fail_msg: >-
      rotate_password needs canon_printer_rotate_confirm=true, canon_printer_password_item (1Password
      item ID), canon_printer_vault and canon_printer_ca_cert.
    quiet: true

- name: Freeze the current password before anything changes
  ansible.builtin.set_fact:
    _cp_old_password: "{{ canon_printer_password }}"
  no_log: true

- name: Roll the 1Password item to a new random value (backed up first by secrets_manager)
  ansible.builtin.include_role:
    name: richard_lynch.common.secrets_manager
  vars:
    secrets_manager_action: roll
    secrets_manager_vault: "{{ canon_printer_vault }}"
    secrets_manager_title: "{{ canon_printer_password_item }}"
    secrets_manager_field: password
    secrets_manager_generate_length: 24  # device limit 4-32 of [0-9A-Za-z]; random_string special=false

- name: Hold the new value
  ansible.builtin.set_fact:
    _cp_new_password: "{{ secrets_manager_value_out }}"
  no_log: true

- name: Change it on the printer — and undo 1Password if that fails
  block:
    - name: Rotate on the device (proves new login works and old is refused)
      richard_lynch.home.canon_printer_settings:
        host: "{{ canon_printer_host }}"
        password: "{{ _cp_old_password }}"
        new_password: "{{ _cp_new_password }}"
        ca_cert: "{{ canon_printer_ca_cert }}"
        apply: true
      register: _cp_rotation
  rescue:
    - name: Roll 1Password back — ONLY if the printer still accepts the old password
      # The module reports which password the device accepts after a failure. If the change landed
      # (device_accepts == 'new'), 1Password already holds the right value and rolling it back would
      # be the lockout.
      when: ansible_failed_result.device_accepts | default('') == 'old'
      ansible.builtin.include_role:
        name: richard_lynch.common.secrets_manager
      vars:
        secrets_manager_action: roll
        secrets_manager_vault: "{{ canon_printer_vault }}"
        secrets_manager_title: "{{ canon_printer_password_item }}"
        secrets_manager_field: password
        secrets_manager_value: "{{ _cp_old_password }}"

    - name: Fail, saying exactly where the credential is
      ansible.builtin.fail:
        msg: >-
          Printer rotation failed ({{ ansible_failed_result.msg | default('unknown') }}). Device
          accepts: {{ ansible_failed_result.device_accepts | default('unknown') }}.
          {{ '1Password was rolled back to the old value, which the printer still uses.'
             if (ansible_failed_result.device_accepts | default('')) == 'old' else
             '1Password was LEFT on the new value, which the printer accepts.'
             if (ansible_failed_result.device_accepts | default('')) == 'new' else
             'Neither value logs in: the previous value is in the secrets_manager backup and the item history.' }}

- name: Sync 1Password metadata and cache, and prove the device accepts what 1Password holds
  ansible.builtin.include_tasks: sync_password.yml

- name: HARD GATE — 1Password now holds exactly what the printer accepted
  ansible.builtin.assert:
    that:
      - _cp_synced_password == _cp_new_password
      - _cp_rotation.rotation.new_login == 'ok'
      - _cp_rotation.rotation.old_login == 'rejected'
    fail_msg: >-
      Rotation incomplete. The printer reports new_login={{ _cp_rotation.rotation.new_login | default('?') }},
      old_login={{ _cp_rotation.rotation.old_login | default('?') }}; check the 1Password item's history.
    success_msg: Rotated. New password logs in, old one is refused, 1Password matches.
  no_log: false
