# Offline scenario — calls the REAL role and asserts its gates and validation fire BEFORE any network
# I/O. A printer cannot exist in CI, so this is check-only coverage (README says so); the protocol
# logic itself is covered by the SDK unit tests (test_canon_rui.py). The host `printer.invalid` never
# resolves, so a test that accidentally reached the network would fail loudly, not pass.
---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  # The scenario CALLS the role (rather than re-implementing it), so the roles directory must be on
  # the search path. Without this the include_role fails with "role not found".
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    # BOTH trees: the installed dependencies (collections.galaxy/) and the tree holding this role's
    # own collection. Pointing at just the latter resolves no dependency, and the failure is
    # CI-only because a dev venv bundles them in site-packages.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
        # The module runs in the controller's own Python (where `requests` is). Interpreter
        # discovery can pick a bare system Python, and every case is then "refused" for a missing
        # library.
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
