---
# Asserts what the REAL role did in converge. A refusal for the wrong reason is a failure here — in
# particular "couldn't resolve module/action", which is what a module the role cannot find produces.
- name: Verify
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load results
      ansible.builtin.set_fact:
        r: "{{ lookup('file', '/tmp/molecule_homeassistant_backup_results.json') | from_json }}"

    - name: Every case was refused, by the intended check
      ansible.builtin.assert:
        that:
          - r.no_token is search('homeassistant_backup_token is empty')
          - r.unreachable is search('could not connect to the Home Assistant websocket')
          - "r.bad_recurrence is search('value of recurrence must be one of: daily, weekly, never')"
          - r.bad_time is search('time must be HH:MM')
          - (r.values() | select('search', 'resolve module') | list) == []
        fail_msg: "{{ r | to_nice_json }}"
