---
- name: Verify the schedule-diff decision matches the module's logic
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Recompute both decisions (mirror the module)
      vars:
        desired: {recurrence: "daily", time: "04:15"}
        current_match: {recurrence: "daily", time: "04:15:00"}
        current_diff: {recurrence: "never", time: null}
      ansible.builtin.set_fact:
        match_needs_update: >-
          {{ (current_match.recurrence != desired.recurrence)
             or (desired.recurrence != 'never' and (current_match.time[:5]) != desired.time) }}
        diff_needs_update: >-
          {{ (current_diff.recurrence != desired.recurrence)
             or (desired.recurrence != 'never' and ((current_diff.time or '')[:5]) != desired.time) }}

    - name: Idempotency — a matching schedule is NOT re-applied; a differing one IS
      ansible.builtin.assert:
        that:
          - not (match_needs_update | bool)
          - diff_needs_update | bool
        fail_msg: "schedule-diff decision is wrong (would thrash or miss a needed update)."
        success_msg: "schedule-diff is idempotent — HH:MM:SS vs HH:MM normalized, only real diffs update."
